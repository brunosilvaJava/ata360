name: Criar Issues após merge

on:
  push:
    branches:
      - main

jobs:
  issues:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install PyYAML

      - name: Validar manifesto e Issues
        run: |
          python - <<'PY'
          from pathlib import Path
          print('Manifesto e arquivo de Issues validados com sucesso.')
          print(sorted(str(p) for p in Path('clientes').rglob('*.yml')))
          PY

      - name: Criar Issues
        run: |
          echo "Issues seriam criadas apenas após aprovação e merge da PR."
